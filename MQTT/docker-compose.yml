services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped

    ports:
      - "1883:1883"   # MQTT
      - "9001:9001"   # WebSockets

    # Credentials from .env (must match IngestionService/.env and the firmware)
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}

    # Generate the password file from MQTT_USERNAME/MQTT_PASSWORD on every start, then start Mosquitto.
    # $$ instead of $: Compose does not substitute anything, the shell in the container reads the environment variables.
    # Indent all lines equally: ">" then joins them into a single command line.
    command: >
      sh -c 'mosquitto_passwd -b -c /mosquitto/config/passwordfile "$$MQTT_USERNAME" "$$MQTT_PASSWORD" &&
      chown mosquitto:mosquitto /mosquitto/config/passwordfile &&
      chmod 0700 /mosquitto/config/passwordfile &&
      exec mosquitto -c /mosquitto/config/mosquitto.conf'

    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./data:/mosquitto/data
      - ./log:/mosquitto/log
