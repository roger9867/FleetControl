version: '3.9'

# Benoetigt eine laufende InfluxDB unter localhost:8086
services:
  ingestionservice:
    build:
      context: ./IngestionService
      dockerfile: Dockerfile
      network: host

    container_name: ingestionservice
    # Host-Netzwerk, damit der Dienst InfluxDB und FleetControlApi (gRPC)
    # unter localhost auf der VM erreichen kann, ohne eigenes Docker-Netzwerk
    network_mode: host

    # Aus .env übernommene Konfiguration für MQTT-Broker, InfluxDB und TripService
    environment:
      Mqtt__Host: ${MQTT_HOST}
      Mqtt__Port: ${MQTT_PORT}
      Mqtt__Username: ${MQTT_USERNAME}
      Mqtt__Password: ${MQTT_PASSWORD}
      Mqtt__UseTls: ${MQTT_USE_TLS}
      Mqtt__Topic: ${MQTT_TOPIC}
      InfluxDB__Url: http://localhost:8086
      InfluxDB__Token: ${INFLUXDB_TOKEN}
      InfluxDB__Org: ${INFLUXDB_ORG}
      InfluxDB__Bucket: ${INFLUXDB_BUCKET}
      TripService__Address: ${TRIP_SERVICE_ADDRESS}
