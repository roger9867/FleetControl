syntax = "proto3";

option csharp_namespace = "IngestionService.Assignments";

package assignments;

// Von IngestionService genutzt, um den kompletten
// Zuordnungsbestand einmalig beim Start in AssignmentCache zu laden.
service AssignmentService {
  rpc GetCurrentAssignments (GetCurrentAssignmentsRequest) returns (GetCurrentAssignmentsResponse);
}

message Assignment {
  string telemetry_unit_id = 1;
  optional string vehicle_id = 2;
  optional string license_plate = 3;
  optional string driver_id = 4;
}

message GetCurrentAssignmentsRequest {}

message GetCurrentAssignmentsResponse {
  repeated Assignment assignments = 1;
}
