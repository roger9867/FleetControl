syntax = "proto3";

option csharp_namespace = "IngestionService.Trip";

import "google/protobuf/timestamp.proto";

package trip;

// Used by TripReactor to report detected trip starts/ends to FleetControlApi
// Only device ID and timestamp are transmitted, since a
// trip is created there from these alone.
service TripService {
  rpc StartTrip (StartTripRequest) returns (StartTripResponse);
  rpc EndTrip (EndTripRequest) returns (EndTripResponse);
}

message StartTripRequest {
  string telemetry_unit_id = 1;
  google.protobuf.Timestamp start_timestamp = 2;
}

message StartTripResponse {
  string trip_id = 1;
}

message EndTripRequest {
  string telemetry_unit_id = 1;
  google.protobuf.Timestamp end_timestamp = 2;
  // Only set if the original StartTrip call failed
  // Used to create the trip retroactively with start and end time
  google.protobuf.Timestamp start_timestamp = 3;
}

message EndTripResponse {
  string trip_id = 1;
}
