version: '3.9'

# Port 5002 fixed, because FleetControlService's appsettings refer to it.
# InfluxDB address via INFLUXDB_URL in .env (default: http://localhost:8086)
services:
  drivedataservice:
    build:
      context: ./DriveDataService
      dockerfile: Dockerfile

    container_name: drivedataservice
    restart: unless-stopped
    network_mode: host

    environment:
      ASPNETCORE_URLS: http://+:5002
      InfluxDB__Url: ${INFLUXDB_URL:-http://localhost:8086}
      InfluxDB__Token: ${INFLUXDB_TOKEN}
      InfluxDB__Org: ${INFLUXDB_ORG}
      InfluxDB__Bucket: ${INFLUXDB_BUCKET}
