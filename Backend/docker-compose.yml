version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: postgres_db
    restart: always

    environment:
      POSTGRES_USER: postgresuser
      POSTGRES_PASSWORD: fleetcontrol
      POSTGRES_DB: fleetcontroldb

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
