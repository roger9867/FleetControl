syntax = "proto3";

option csharp_namespace = "FleetControlServer.Api.Grpc";

import "google/protobuf/timestamp.proto";

package trip;

service TripService {
  // Startet eine neue Fahrt für eine Telemetrie-Einheit
  rpc StartTrip (StartTripRequest) returns (StartTripResponse);

  // Beendet eine laufende Fahrt einer Telemetrie-Einheit
  rpc EndTrip (EndTripRequest) returns (EndTripResponse);
}

// Anfrage zum Starten einer Fahrt mit Startzeitpunkt
message StartTripRequest {
  string telemetry_unit_id = 1;
  google.protobuf.Timestamp start_timestamp = 2;
}

// Antwort mit der Id der gestarteten Fahrt.
message StartTripResponse {
  string trip_id = 1;
}

// Anfrage zum Beenden einer Fahrt mit Endzeitpunkt.
message EndTripRequest {
  string telemetry_unit_id = 1;
  google.protobuf.Timestamp end_timestamp = 2;
  google.protobuf.Timestamp start_timestamp = 3;
}

// Antwort mit der Id der beendeten Fahrt
message EndTripResponse {
  string trip_id = 1;
}
