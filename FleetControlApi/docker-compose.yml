version: "3.9"

# Benoetigt eine laufende Postgres unter localhost:5432 - die wird zentral
# ueber Postgres/docker-compose.yml gestartet (network_mode: host, daher
# unabhaengig davon, welcher Compose-Stack sie hochgefahren hat).
services:
  fleetcontrolservice:
    build:
      context: ./FleetControlApi
      dockerfile: Dockerfile
      network: host

    container_name: fleetcontrolservice
    network_mode: host

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Http__Port: 5000
      Grpc__Port: 5001
      ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=fleetcontroldb;Username=postgresuser;Password=fleetcontrol"
