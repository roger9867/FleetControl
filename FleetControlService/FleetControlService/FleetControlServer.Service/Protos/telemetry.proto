syntax = "proto3";

option csharp_namespace = "FleetControlServer.Service.Grpc";

import "google/protobuf/timestamp.proto";

package telemetry;

// Reads back the InfluxDB points that IngestionService wrote for a device,
// scoped to a time range (a trip's Start/EndTimestamp).
service TelemetryQuery {
  rpc GetTelemetryPoints (GetTelemetryPointsRequest) returns (GetTelemetryPointsResponse);

  // Ein Punkt pro angefragter Geräte-ID - die jeweils letzte je gemeldete
  // Position. Geräte ohne jemals gemeldete Daten fehlen einfach in der
  // Antwort, statt einen Fehler auszulösen.
  rpc GetLatestPoints (GetLatestPointsRequest) returns (GetLatestPointsResponse);

  // Wie GetLatestPoints, aber ueber das vehicleId-Tag statt deviceId -
  // fragt direkt nach der Fahrzeug-Zuordnung, mit der der Datenpunkt
  // geschrieben wurde, statt ueber die aktuelle T-Einheit-Zuordnung zu gehen.
  rpc GetLatestPointsByVehicle (GetLatestPointsByVehicleRequest) returns (GetLatestPointsByVehicleResponse);

  // Loescht alle Punkte eines Geraets in [start, end) - genutzt, wenn eine
  // Fahrt geloescht wird, damit keine verwaisten InfluxDB-Punkte zurueckbleiben.
  rpc DeleteTelemetryPoints (DeleteTelemetryPointsRequest) returns (DeleteTelemetryPointsResponse);
}

message GetTelemetryPointsRequest {
  string device_id = 1;
  google.protobuf.Timestamp start = 2;
  google.protobuf.Timestamp end = 3;
}

message TelemetryPoint {
  google.protobuf.Timestamp timestamp = 1;
  double lat = 2;
  double lon = 3;
  double speed_kmh = 4;
  double accel_ms2 = 5;
  string driver_id = 6;
  string device_id = 7;
}

message GetTelemetryPointsResponse {
  repeated TelemetryPoint points = 1;
}

message GetLatestPointsRequest {
  repeated string device_ids = 1;
}

message DeviceLatestPoint {
  string device_id = 1;
  TelemetryPoint point = 2;
}

message GetLatestPointsResponse {
  repeated DeviceLatestPoint points = 1;
}

message GetLatestPointsByVehicleRequest {
  repeated string vehicle_ids = 1;
}

message VehicleLatestPoint {
  string vehicle_id = 1;
  TelemetryPoint point = 2;
}

message GetLatestPointsByVehicleResponse {
  repeated VehicleLatestPoint points = 1;
}

message DeleteTelemetryPointsRequest {
  string device_id = 1;
  google.protobuf.Timestamp start = 2;
  google.protobuf.Timestamp end = 3;
}

message DeleteTelemetryPointsResponse {
  bool success = 1;
}
